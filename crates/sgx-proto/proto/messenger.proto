syntax = "proto3";

package messenger.v1;

import "google/protobuf/timestamp.proto";

// ==================== Service ====================

service MessengerService {
  rpc GetBackendInfo(GetBackendInfoRequest) returns (BackendInfo);
  rpc GetAuthState(GetAuthStateRequest) returns (AuthState);
  rpc SubmitPhoneNumber(SubmitPhoneNumberRequest) returns (SubmitPhoneNumberResponse);
  rpc SubmitAuthCode(SubmitAuthCodeRequest) returns (SubmitAuthCodeResponse);
  rpc SubmitPassword(SubmitPasswordRequest) returns (SubmitPasswordResponse);
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc StreamUpdates(StreamUpdatesRequest) returns (stream Update);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc DownloadAvatar(DownloadAvatarRequest) returns (DownloadAvatarResponse);
  rpc SetProxy(SetProxyRequest) returns (SetProxyResponse);
  rpc SetProfile(SetProfileRequest) returns (SetProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc StreamSimplexUpdates(StreamSimplexUpdatesRequest) returns (stream SimplexUpdate);
  rpc ResetSimplex(ResetSimplexRequest) returns (ResetSimplexResponse);
  rpc SendSimplexMessage(SendSimplexMessageRequest) returns (SendSimplexMessageResponse);
  // Briefing 045 W1: returns the contacts known to the SimpleX sidecar.
  // Single source of truth for the frontend contact list.
  rpc ListSimplexContacts(ListSimplexContactsRequest) returns (ListSimplexContactsResponse);
  // Briefing 045 W5: destructive wipe of all contacts and their crypto
  // state. Only intended to be called from the Wizard orphan-cleanup
  // confirmation modal; the Tauri wrapper gates on `wizard_intent=true`.
  // Leaves the user-profile row intact so SetProfile can reuse it.
  rpc WipeAllSimplexContacts(WipeAllSimplexContactsRequest) returns (WipeAllSimplexContactsResponse);
}

// ==================== Common Types ====================

message ChatId {
  string backend = 1;
  string id = 2;
}

message MessageId {
  string backend = 1;
  string chat_id = 2;
  string id = 3;
}

// ==================== Backend Info ====================

message GetBackendInfoRequest {}

message BackendInfo {
  string backend_id = 1;
  string display_name = 2;
  string version = 3;
  bool is_authenticated = 4;
  string badge_label = 5;
  string badge_color = 6;
}

// ==================== Auth ====================

message GetAuthStateRequest {}

message AuthState {
  oneof state {
    WaitPhone wait_phone = 1;
    WaitCode wait_code = 2;
    WaitPassword wait_password = 3;
    Ready ready = 4;
    LoggedOut logged_out = 5;
    AuthError error = 6;
  }
}

message WaitPhone {}
message WaitCode { string phone_number_hint = 1; }
message WaitPassword { string password_hint = 1; }
message Ready { string user_id = 1; string display_name = 2; }
message LoggedOut {}
message AuthError { string message = 1; }

message SubmitPhoneNumberRequest { string phone_number = 1; }
message SubmitPhoneNumberResponse { bool success = 1; }

message SubmitAuthCodeRequest { string code = 1; }
message SubmitAuthCodeResponse { bool success = 1; }

message SubmitPasswordRequest { string password = 1; }
message SubmitPasswordResponse { bool success = 1; }

message LogoutRequest {}
message LogoutResponse { bool success = 1; }

// ==================== Chats ====================

message ListChatsRequest {
  int32 limit = 1;
  int64 offset_order = 2;
}

message ListChatsResponse {
  repeated Chat chats = 1;
}

message Chat {
  ChatId chat_id = 1;
  string title = 2;
  ChatType chat_type = 3;
  string avatar_url = 4;
  UnifiedMessage last_message = 5;
  int32 unread_count = 6;
  bool is_encrypted = 7;
  bool is_muted = 8;
  bool is_pinned = 9;
  google.protobuf.Timestamp last_activity = 10;
}

enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_PRIVATE = 1;
  CHAT_TYPE_GROUP = 2;
  CHAT_TYPE_CHANNEL = 3;
  CHAT_TYPE_BOT = 4;
}

// ==================== Messages ====================

message GetMessagesRequest {
  ChatId chat_id = 1;
  int32 limit = 2;
  string from_message_id = 3;
}

message GetMessagesResponse {
  repeated UnifiedMessage messages = 1;
}

message UnifiedMessage {
  MessageId message_id = 1;
  string sender_id = 2;
  string sender_name = 3;
  string sender_avatar_url = 4;
  google.protobuf.Timestamp timestamp = 5;
  bool is_outgoing = 6;
  oneof content {
    TextContent text = 10;
    MediaContent media = 11;
    StickerContent sticker = 12;
  }
  string reply_to_message_id = 20;
  bool is_edited = 21;
}

message TextContent {
  string body = 1;
}

message MediaContent {
  MediaType media_type = 1;
  string url = 2;
  string thumbnail_url = 3;
  string caption = 4;
  string file_name = 5;
  int64 file_size = 6;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_PHOTO = 1;
  MEDIA_TYPE_VIDEO = 2;
  MEDIA_TYPE_AUDIO = 3;
  MEDIA_TYPE_DOCUMENT = 4;
  MEDIA_TYPE_VOICE = 5;
}

message StickerContent {
  string emoji = 1;
  string url = 2;
}

// ==================== Send ====================

message SendMessageRequest {
  ChatId chat_id = 1;
  oneof content {
    TextContent text = 10;
  }
  string reply_to_message_id = 20;
}

message SendMessageResponse {
  MessageId message_id = 1;
}

// ==================== Streaming ====================

message StreamUpdatesRequest {}

message Update {
  oneof update {
    NewMessage new_message = 1;
    MessageEdited message_edited = 2;
    MessageDeleted message_deleted = 3;
    ChatUpdated chat_updated = 4;
    TypingUpdate typing = 5;
    AuthStateChanged auth_state_changed = 6;
  }
}

message NewMessage {
  UnifiedMessage message = 1;
}

message MessageEdited {
  MessageId message_id = 1;
  string new_body = 2;
}

message MessageDeleted {
  MessageId message_id = 1;
}

message ChatUpdated {
  Chat chat = 1;
}

message TypingUpdate {
  ChatId chat_id = 1;
  repeated string user_ids = 2;
}

message AuthStateChanged {
  AuthState state = 1;
}

// ==================== Avatar Download ====================

message DownloadAvatarRequest {
  int32 file_id = 1;
}

message DownloadAvatarResponse {
  string data_url = 1; // base64 data URL (data:image/jpeg;base64,...)
}

// ==================== Proxy ====================

message SetProxyRequest {
  bool enabled = 1;
  string server = 2;
  int32 port = 3;
}

message SetProxyResponse {
  bool success = 1;
  string message = 2;
}

// ==================== User Profile ====================

message SetProfileRequest {
  string display_name = 1;
  string full_name    = 2;
  string bio          = 3;
}

message SetProfileResponse {
  bool   success = 1;
  string error   = 2;
}

message GetProfileRequest {}

message GetProfileResponse {
  bool   has_profile  = 1;
  string display_name = 2;
  string full_name    = 3;
  string bio          = 4;
}

// ==================== SimpleX Updates Stream ====================

message StreamSimplexUpdatesRequest {}

message SimplexUpdate {
  oneof update {
    SimplexContactEstablished contact_established = 1;
    SimplexNewMessage         new_message         = 2;
    SimplexContactUpdated     contact_updated     = 3;
    SimplexHandshakeProgress  handshake_progress  = 4;
    // Briefing 044 W6: per-contact SMP connection lifecycle events.
    // Emitted by the sidecar's background loop as ConnState transitions;
    // consumed by the frontend to render per-contact status dots.
    SimplexContactDisconnected contact_disconnected = 5;
    SimplexContactReconnecting contact_reconnecting = 6;
    SimplexContactReconnected  contact_reconnected  = 7;
    SimplexContactDead         contact_dead         = 8;
  }
}

// Granular progress events emitted at each handshake stage so the
// frontend StatusBanner can show live feedback during contact setup.
// `state` matches the StatusBanner vocabulary:
//   "bootstrapping" - mid-handshake, banner stays visible
//   "connected"     - success terminal state, banner auto-hides
//   "error"         - failure, banner sticks until dismissed
message SimplexHandshakeProgress {
  string stage     = 1; // short identifier: "tls_connect", "queue_create", ...
  string message   = 2; // human-readable text shown in the banner detail
  string state     = 3; // "bootstrapping" | "connected" | "error"
  int64  timestamp = 4;
}

// Emitted once per contact after the AgentConfirmation handshake
// completes and the peer profile has been decoded.
message SimplexContactEstablished {
  string contact_id      = 1;
  string display_name    = 2;
  string full_name       = 3;
  string bio             = 4;
  int64  established_at  = 5;
}

// Emitted on every decrypted peer chat message (A_MSG 'M' variant).
message SimplexNewMessage {
  string contact_id = 1;
  int64  msg_id     = 2;
  int64  timestamp  = 3;
  string body       = 4;
  bool   is_own     = 5;
}

// Emitted when a peer broadcasts a profile change. Not yet generated
// by the sidecar but reserved so the Tauri layer can register the
// handler today.
message SimplexContactUpdated {
  string contact_id   = 1;
  string display_name = 2;
  string full_name    = 3;
  string bio          = 4;
}

// Briefing 044 W6: connection lifecycle events per contact.
//
// Emitted once when the BG loop observes a recoverable IO / TLS error
// and begins the reconnect backoff. UI should switch the contact's
// status dot to yellow. Precedes one or more SimplexContactReconnecting
// events until the reconnect either succeeds or gives up.
message SimplexContactDisconnected {
  string contact_id = 1;
  int64  timestamp  = 2;
}

// Emitted at the start of each reconnect attempt. `attempt` is 1-based.
// UI can keep the yellow dot and show "attempt N/max" in a tooltip.
message SimplexContactReconnecting {
  string contact_id   = 1;
  uint32 attempt      = 2;
  uint32 max_attempts = 3;
  int64  timestamp    = 4;
}

// Emitted once after a successful reconnect including the grace-window
// SUB OK. UI returns to green; subsequent messages flow normally through
// SimplexNewMessage.
message SimplexContactReconnected {
  string contact_id = 1;
  int64  timestamp  = 2;
}

// Emitted once after the reconnect loop exhausts its attempts. The
// connection is gone until app restart or explicit reconnect. UI shows
// a red dot and a retry button (follow-up work if tight on time).
message SimplexContactDead {
  string contact_id = 1;
  int64  timestamp  = 2;
}

// ==================== Briefing 045 W1: ContactSummary + ListContacts ====================
//
// Tier::PublicMetadata only. Safe to keep in unencrypted frontend memory.
// contact_id is technically Tier::ProtectedMetadata (links to backend
// crypto state) but needed for RPC correlation on the wire.
//
// Never include keys, ratchet state, or message plaintext in this
// message - those are Tier::Secret and never leave the sidecar.

// Mirror of `crate::contact_session::ConnState`. Exposed on the wire so
// the frontend can render sidebar dots without maintaining a second
// map indexed by contact_id. The Unspecified = 0 sentinel is the proto3
// convention for default values; it should never appear in practice.
enum ConnStateProto {
  CONN_STATE_UNSPECIFIED  = 0;
  CONN_STATE_CONNECTED    = 1;
  CONN_STATE_RECONNECTING = 2;
  CONN_STATE_DEAD         = 3;
}

message ContactSummary {
  string         contact_id            = 1;
  string         display_name          = 2;
  string         full_name             = 3;
  int64          established_at_unix   = 4;
  // Wall-clock time of the most recent message on this contact (either
  // direction). Zero when no message has been seen yet.
  int64          last_message_at_unix  = 5;
  // Unread count maintained server-side (not the SMP server - our own
  // sidecar, based on received messages not yet ACKed by the UI).
  int32          unread_count          = 6;
  // Live connection state for the running contact session. If the
  // contact has no running session (e.g. BG loop exited, not yet
  // respawned) the value is CONN_STATE_CONNECTED as a stable default.
  ConnStateProto conn_state            = 7;
}

message ListSimplexContactsRequest {}

message ListSimplexContactsResponse {
  repeated ContactSummary contacts = 1;
}

// ==================== Briefing 045 W5: WipeAllSimplexContacts ====================

message WipeAllSimplexContactsRequest {}

message WipeAllSimplexContactsResponse {
  // Number of rows that were deleted from the contacts table.
  // Auxiliary tables (messages, sender_auth, ratchet_states,
  // queue_auth_private column) are wiped too but their row counts
  // are not reported individually.
  uint32 deleted_count = 1;
}

message ResetSimplexRequest {}
message ResetSimplexResponse {
  bool   success = 1;
  string error   = 2;
}

// ==================== SimpleX Send ====================

// Outbound chat text on a SimpleX contact's reply queue. Routed to the
// per-contact background session via ContactCommand::SendText; the
// response carries the SMP-acknowledged sndMsgId and the wall-clock
// timestamp the server returned Ok at, so the frontend can correlate
// the own-bubble echo emitted on the SimplexUpdate stream.
message SendSimplexMessageRequest {
  string contact_id = 1;
  string body       = 2;
}

message SendSimplexMessageResponse {
  uint64 msg_id       = 1;
  int64  timestamp_ms = 2;
}
